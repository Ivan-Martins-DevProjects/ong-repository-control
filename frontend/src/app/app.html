<div class="app-layout">
  <button class="hamburger" (click)="toggleSidebar()" aria-label="Abrir menu de navegação">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="sidebar-overlay" [class.open]="sidebarOpen()" (click)="closeSidebar()" aria-hidden="true"></div>
  @if (!hideSidebar()) {
    <app-sidebar [open]="sidebarOpen()" (navigate)="closeSidebar()" />
  }
  <main>
    <router-outlet />
  </main>
</div>
