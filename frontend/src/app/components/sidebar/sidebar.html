<aside class="sidebar" [class.open]="open()" aria-label="Menu de navegação">
  <div class="sidebar__header">
    <div class="sidebar__logo">
      <span class="sidebar__logo-mark" aria-hidden="true">
        <span class="material-symbols-outlined">warehouse</span>
      </span>
      <span class="sidebar__logo-text">Storager</span>
    </div>
  </div>

  <nav class="sidebar__nav" aria-label="Principal">
    <a routerLink="/dashboard" routerLinkActive="active" class="sidebar__link" (click)="navigate.emit()" [routerLinkActiveOptions]="{exact:true}">
      <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
      <span>Dashboard</span>
    </a>
    <a routerLink="/estoque" routerLinkActive="active" class="sidebar__link" (click)="navigate.emit()">
      <span class="material-symbols-outlined" aria-hidden="true">inventory_2</span>
      <span>Estoque</span>
    </a>
    <a routerLink="/historico" routerLinkActive="active" class="sidebar__link" (click)="navigate.emit()">
      <span class="material-symbols-outlined" aria-hidden="true">history</span>
      <span>Histórico</span>
    </a>

    <div class="sidebar__divider" role="separator"></div>

    <div class="sidebar__group">
      <span class="sidebar__group-label">Configurações</span>
      <a routerLink="/configuracoes/categorias" routerLinkActive="active" class="sidebar__link sidebar__link--sub" (click)="navigate.emit()">
        <span class="material-symbols-outlined" aria-hidden="true">category</span>
        <span>Categorias</span>
      </a>
      <a routerLink="/configuracoes/notificacoes" routerLinkActive="active" class="sidebar__link sidebar__link--sub" (click)="navigate.emit()">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        <span>Notificações</span>
      </a>
    </div>
  </nav>

  <div class="sidebar__footer">
    @if (user(); as u) {
      <div class="sidebar__user">
        <div class="sidebar__avatar" aria-hidden="true">{{ u.name.charAt(0) }}</div>
        <div class="sidebar__user-info">
          <span class="sidebar__user-name">{{ u.name }}</span>
          <span class="sidebar__user-email">{{ u.email }}</span>
        </div>
      </div>
    }
    <button class="sidebar__logout" (click)="doLogout()" aria-label="Sair da conta">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      <span>Sair</span>
    </button>
  </div>
</aside>
